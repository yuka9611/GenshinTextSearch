name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - 'webui/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://genshin-text-search.pages.dev
    defaults:
      run:
        working-directory: webui
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_AXIOS_BASE_URL: ''
      VITE_API_TIMEOUT_MS: '30000'
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS || 'github,google' }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Check production build configuration
        run: |
          for variable in CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing repository secret or variable: ${variable}"
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: node --test tests/*.test.mjs
      - name: Build frontend
        run: npm run build
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret to enable deployment."
            exit 1
          fi
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --yes wrangler@4.161.0 pages deploy dist
          --project-name genshin-text-search
          --branch master
          --commit-hash "$GITHUB_SHA"
          --commit-message "Deploy frontend $GITHUB_SHA"
      - name: Verify production API binding
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            https://genshin-text-search.pages.dev/healthz \
            | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const health = JSON.parse(data); if (health.status !== 'ok' || health.cloudMode !== true) process.exit(1); console.log('Production API binding is healthy'); });"
